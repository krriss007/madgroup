# TradePilot — full stack for a VPS: terminal + API + PostgreSQL + automatic HTTPS.
#
#   cp deploy/.env.example deploy/.env   # then fill in DOMAIN + secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Caddy obtains and renews a Let's Encrypt certificate for DOMAIN on its own, so
# https://DOMAIN serves the app within a minute of DNS resolving here.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tradepilot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/tradepilot
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env (32+ bytes)}
      BRIDGE_SECRET: ${BRIDGE_SECRET:?set BRIDGE_SECRET in deploy/.env (32+ bytes)}
      COOKIE_SECURE: 'true'
      COOKIE_SAME_SITE: lax
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in deploy/.env}
      # Public instance: sign visitors into the shared DEMO account so the site
      # is usable without handing out a password. DEMO only — LIVE trading still
      # requires enabling it explicitly plus your own connected MT5 terminal.
      DEMO_AUTO_LOGIN: 'true'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: tradepilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradepilot -d tradepilot']
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
