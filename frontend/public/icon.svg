<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- TradePilot app icon — original mark.
       Dark terminal panel with a gold candlestick rally and a pilot chevron. -->
  <rect width="512" height="512" rx="112" ry="112" fill="#0b1220"/>
  <rect x="8" y="8" width="496" height="496" rx="104" ry="104" fill="none" stroke="#1e293b" stroke-width="16"/>

  <!-- candlesticks: three green/gold bars climbing left to right -->
  <g stroke="#22c55e" stroke-width="14" stroke-linecap="round">
    <line x1="150" y1="250" x2="150" y2="392"/>
    <line x1="256" y1="200" x2="256" y2="352"/>
  </g>
  <rect x="118" y="286" width="64" height="72" rx="10" fill="#22c55e"/>
  <rect x="224" y="238" width="64" height="80" rx="10" fill="#22c55e"/>

  <g stroke="#f59e0b" stroke-width="14" stroke-linecap="round">
    <line x1="362" y1="120" x2="362" y2="300"/>
  </g>
  <rect x="330" y="150" width="64" height="112" rx="10" fill="#f59e0b"/>

  <!-- pilot chevron under the rally -->
  <path d="M120 452 L256 386 L392 452" fill="none" stroke="#38bdf8" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
